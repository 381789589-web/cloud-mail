name: Debug Token

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect account id and token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== A. Secret 值检查 ==="
          echo "token_prefix=${CLOUDFLARE_API_TOKEN:0:7}"
          echo "account_id_length=${#CLOUDFLARE_ACCOUNT_ID}"
          echo "expected_length=32"
          echo ""
          echo "=== B. 用【硬编码】账户ID 测试写权限 ==="
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/e8d6915eca01750f8ee6c2e6f89944f4/storage/kv/namespaces" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"title":"ci-perm-test2"}'
          echo ""
          echo ""
          echo "=== C. 用【Secret】账户ID 测试写权限（对照）==="
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"title":"ci-perm-test3"}'
